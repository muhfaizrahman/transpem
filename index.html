<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPJS-Check Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE work: a verifier's desk tool, calm, exact, nothing decorative
   IDEA the claim folder that gets a red "potensi klaim ganda" stamp before it reaches the cashier
   PICTURE the working screens themselves: queue, risk meter, side-by-side claim comparison
   COLOUR white panels on pale green-grey, deep green sidebar, red / amber / green for risk only
   TYPE Plus Jakarta Sans throughout
   LAYOUT sidebar + content on laptop; top nav strip and stacked panels below 860px */
:root{color-scheme:light dark;
--bg:light-dark(#eef2f0,#0b1311);--panel:light-dark(#ffffff,#121c19);--ink:light-dark(#10231f,#e4eeeb);--mute:light-dark(#566a65,#93a7a1);--line:light-dark(#dbe4e0,#25342f);
--brand:light-dark(#0a6b53,#3cc69a);--onbrand:light-dark(#ffffff,#05241b);--tint:light-dark(#e2f1eb,#163029);--side:light-dark(#0c3a2f,#07110e);
--hi:light-dark(#c3261f,#ff7a70);--mid:light-dark(#9a5a00,#f2b84b);--ok:light-dark(#17774a,#55d391);
--hiS:color-mix(in srgb,var(--hi) 11%,var(--panel));--midS:color-mix(in srgb,var(--mid) 13%,var(--panel));--okS:color-mix(in srgb,var(--ok) 11%,var(--panel))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.015em}
h1{font-size:clamp(24px,3vw,32px);font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--brand)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:#e6f2ee;display:flex;flex-direction:column;padding:20px 14px;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;font-size:18px;color:#fff}
.logo small{display:block;font-weight:500;font-size:12px;color:#9cc4b6}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#b7d4ca;font-weight:500}
.nav button:hover{background:#ffffff14;color:#fff}
.nav button.on{background:#ffffff1f;color:#fff;font-weight:700}
.nav button:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.nav .n{margin-left:auto;background:#f2b84b;color:#2a1a00;border-radius:99px;font-size:12px;font-weight:700;padding:0 7px}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid #ffffff1f;padding-top:12px}
.sidefoot button{all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;color:#9cc4b6;font-size:13px}
.sidefoot button:hover{color:#fff;background:#ffffff14}
.main{display:flex;flex-direction:column;min-height:100%}
.top{display:flex;align-items:center;gap:12px;padding:14px max(3vw,16px);background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .who{margin-left:auto;display:flex;align-items:center;gap:10px;text-align:right;font-size:13px}
.top .who b{display:block;font-size:14px}
.av{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.bell{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center}
.bell i{position:absolute;top:-5px;right:-5px;background:var(--hi);color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:99px;padding:1px 6px}
.crumb{font-size:13px;color:var(--mute)}
.view{padding:24px max(3vw,16px) 48px;display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;justify-content:space-between}
.head p{color:var(--mute);margin-top:6px;max-width:70ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel>h2,.panel>h3{margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{color:var(--mute);font-size:13px}
.kpi b{display:block;font-size:clamp(22px,2.6vw,28px);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.kpi small{color:var(--mute);font-size:12.5px}
.kpi.hot{border-color:color-mix(in srgb,var(--hi) 45%,var(--line))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.red{background:var(--hi);border-color:var(--hi);color:#fff}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--brand) 5%,var(--panel))}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}
.id{font-weight:700;white-space:nowrap}
.mute{color:var(--mute)}
.small{font-size:13px}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--tint);color:var(--ink)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.st.ok{background:var(--okS);color:var(--ok)}
.st.mid{background:var(--midS);color:var(--mid)}
.st.hi{background:var(--hiS);color:var(--hi)}
.st.grey{background:color-mix(in srgb,var(--mute) 14%,var(--panel));color:var(--mute)}
.rule{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;margin:1px 2px 1px 0;white-space:nowrap}
.meter{height:8px;border-radius:99px;background:color-mix(in srgb,var(--mute) 18%,var(--panel));position:relative;overflow:hidden;min-width:60px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.meter.big{height:14px;overflow:visible}
.meter .tk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.35}
.scorecell{display:flex;align-items:center;gap:8px;min-width:120px}
.scorecell b{width:26px;text-align:right;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{font-size:16px;font-weight:400;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:10px 12px;min-height:44px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 60%,transparent);border-color:var(--brand)}
textarea{min-height:96px;resize:vertical}
.hint{font-size:12.5px;font-weight:500;color:var(--mute)}
.err{color:var(--hi);font-size:13px;font-weight:600}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form .wide{grid-column:1/-1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 16px}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--brand)}
.alert{display:flex;gap:14px;align-items:flex-start;border-radius:12px;padding:16px 18px;border:1px solid}
.alert.hi{background:var(--hiS);border-color:color-mix(in srgb,var(--hi) 35%,transparent)}
.alert.mid{background:var(--midS);border-color:color-mix(in srgb,var(--mid) 35%,transparent)}
.alert.ok{background:var(--okS);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.alert .ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.alert.hi .ic{background:var(--hi)}.alert.mid .ic{background:var(--mid)}.alert.ok .ic{background:var(--ok)}
.reasons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.reasons li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.reasons li .w{font-weight:700;font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:600}
.cmp td:first-child{color:var(--mute);width:24%}
.cmp td.same{background:var(--hiS);font-weight:700}
.cmp td.near{background:var(--midS);font-weight:700}
.tag{font-size:11.5px;font-weight:700;color:var(--hi);margin-left:6px;white-space:nowrap}
.tag.n{color:var(--mid)}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.tl li{position:relative;font-size:14px}
.tl li::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--brand)}
.tl li.hot::before{border-color:var(--hi);background:var(--hi)}
.tl li.me{font-weight:700}
.tl time{display:block;font-size:12.5px;color:var(--mute)}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--bg);border:1px solid var(--line)}
.msg.vf{background:var(--tint)}
.msg b{font-size:12.5px;display:block}
.msg time{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.thread{display:flex;flex-direction:column;gap:8px}
.empty{padding:28px;text-align:center;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:22px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bars .stack{flex:1;width:100%;max-width:56px;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.bars .tot{background:color-mix(in srgb,var(--brand) 22%,var(--panel));border-radius:6px 6px 0 0;position:relative;display:flex;flex-direction:column;justify-content:flex-end}
.bars .fl{background:var(--hi);border-radius:0}
.bars .v{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:12.5px;font-weight:700}
.bars .lb{font-size:12px;color:var(--mute);white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(110px,180px) minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.hbar .t{height:12px;border-radius:99px;background:color-mix(in srgb,var(--mute) 14%,var(--panel))}
.hbar .t i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.rulecard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;align-items:start}
.rulecard .ps{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;cursor:pointer;margin:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:color-mix(in srgb,var(--mute) 35%,var(--panel));transition:.15s;pointer-events:none}
.sw span::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+span{background:var(--brand)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.notif{position:absolute;right:max(3vw,16px);top:64px;width:min(380px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px #0003;z-index:20;max-height:70vh;overflow:auto}
.notif h3{padding:14px 16px;border-bottom:1px solid var(--line)}
.notif button{all:unset;display:block;cursor:pointer;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;width:100%;box-sizing:border-box}
.notif button:hover{background:var(--bg)}
.notif button.un{font-weight:700}
.notif button.un::before{content:"";display:inline-block;width:8px;height:8px;background:var(--hi);border-radius:50%;margin-right:8px}
.notif time{display:block;font-size:12px;color:var(--mute);font-weight:400}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px;z-index:50}
.modal .box{background:var(--panel);border-radius:14px;padding:22px;width:min(520px,100%);display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:12px 18px;border-radius:10px;font-weight:600;z-index:60;box-shadow:0 8px 24px #0004;max-width:calc(100vw - 32px)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--tint);border-top-color:var(--brand);animation:sp 0.8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--panel)}
.lg-art{background:var(--side);color:#e6f2ee;padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;gap:24px;justify-content:center}
.lg-art h1{font-size:clamp(30px,4vw,46px);color:#fff;line-height:1.05;text-wrap:balance}
.lg-art p{color:#b7d4ca;font-size:16px;max-width:46ch}
.lg-art>svg{width:100%;max-width:520px;height:auto}
.lg-form{padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;gap:16px;justify-content:center;max-width:560px}
.roles{display:flex;flex-direction:column;gap:10px}
.roles button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center}
.roles button:hover{border-color:var(--brand);background:var(--tint)}
.roles button:focus-visible{outline:2px solid var(--brand)}
.roles b{display:block}
.roles small{color:var(--mute);font-size:13px}
details.demo{border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px}
details.demo summary{cursor:pointer;font-weight:700}
details.demo ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (max-width:980px){.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:8px}
 .logo{padding:4px 8px}.logo small{display:none}
 .nav{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3}
 .nav button{white-space:nowrap;padding:8px 12px}
 .sidefoot{margin:0 0 0 auto;flex-direction:row;border:0;padding:0}
 .top{position:relative}
 .login{grid-template-columns:minmax(0,1fr)}
 .lg-art>svg{max-width:380px}
}
@media (max-width:640px){
 .g2,.form{grid-template-columns:minmax(0,1fr)}
 .top .who span{display:none}
 .view{padding-top:16px}
 table{font-size:13px}
 .stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}
 .stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 6px;text-align:right}
 .stack td::before{content:attr(data-l);color:var(--mute);font-size:12.5px;text-align:left}
 .stack td.num{text-align:right}
 .cmp td:first-child{width:auto}
}
</style>
</head>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- master data (fiktif) ---------- */
const RS=[{id:'RSA',name:'RSUD Sehat Sentosa',kota:'Bekasi',user:'Rina Astuti'},{id:'RSB',name:'RS Harapan Bunda',kota:'Jakarta Timur',user:'Dimas Pratama'},{id:'RSC',name:'RS Medika Utama',kota:'Depok',user:'Laila Nurhasanah'}];

const TD=[
 {k:'37.22',n:'Kateterisasi jantung kiri',dx:'I20.0',tarif:12500000,gap:180},
 {k:'39.95',n:'Hemodialisis',dx:'N18.5',tarif:920000,gap:0},

const hash=s=>{let h=2166136261;for(const c of s){h=Math.imul(h^c.charCodeAt(0),16777619)>>>0}const x=h.toString(16).toUpperCase().padStart(8,'0');return 'PSN-'+x.slice(0,4)+'-'+x.slice(4,8)};
const days=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);
const fd=iso=>new Date(iso+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const ft=ms=>new Date(ms).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const rpS=n=>n>=1e9?'Rp '+(n/1e9).toLocaleString('id-ID',{maximumFractionDigits:2})+' M':n>=1e6?'Rp '+(n/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt':rp(n);
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const lvl=(s,R)=>s>=R.hi?'hi':s>=R.mid?'mid':'ok';
const LV={hi:'Risiko Tinggi',mid:'Risiko Sedang',ok:'Aman'};

function detect(c,pool,R){
 const t=td(c.t),hits=[];
 for(const p of pool){
  if(p.id===c.id||p.peserta!==c.peserta||p.status==='Dibatalkan'||p.status==='Draf')continue;
  const d=Math.abs(days(c.tgl,p.tgl)),same=p.t===c.t,r=[];
  if(R.R1.on&&same&&d===0)r.push(['R1',`Pasien, tindakan, dan tanggal sama dengan ${p.id} (${rsN(p.rs)}).`]);
  if(R.R2.on&&same&&p.rs!==c.rs&&d<=R.R2.n)r.push(['R2',`Tindakan yang sama sudah diklaim ${rsN(p.rs)} ${d===0?'pada hari yang sama':d+' hari '+(c.tgl>=p.tgl?'sebelumnya':'sesudahnya')} (${p.id}).`]);
  if(R.R3.on&&same&&t.gap>0&&p.dx===c.dx&&p.status==='Dibayar'&&d>0&&d<=t.gap)r.push(['R3',`Kasus yang sama (${c.dx}, ${t.n}) sudah dibayar pada ${p.id}, ${fd(p.tgl)}.`]);
  if(R.R4.on&&same&&t.gap>0&&p.status!=='Dibayar'&&d>0&&d<=t.gap)r.push(['R4',`${t.n} diulang dalam ${d} hari (${p.id}); tidak lazim berulang ${t.gap>=9999?'pada pasien yang sama':'dalam '+t.gap+' hari'}.`]);
  const pct=Math.abs(c.nom-p.nom)/p.nom*100;
  if(R.R5.on&&d<=R.R5.d&&!(same&&d===0)&&pct<=R.R5.x)r.push(['R5',`Tanggal berselisih ${d} hari dan nominal mirip (selisih ${pct.toLocaleString('id-ID',{maximumFractionDigits:1})}%) dengan ${p.id}.`]);
  if(r.length)hits.push({p,r,s:r.reduce((a,[k])=>a+R[k].w,0)});
 }
 if(!hits.length)return{score:0,rules:[],match:null,lvl:'ok'};
 hits.sort((a,b)=>b.s-a.s);
 const seen={},rules=[];
 for(const h of hits)for(const[k,txt]of h.r)if(!seen[k]){seen[k]=1;rules.push({k,txt,ref:h.p.id})}
 rules.sort((a,b)=>a.k<b.k?-1:1);
 const score=Math.min(100,rules.reduce((a,r)=>a+R[r.k].w,0));
 return{score,rules,match:hits[0].p.id,lvl:lvl(score,R)};
}

function parseCsv(txt){
 const lines=txt.trim().split(/\r?\n/).filter(Boolean);if(/no_peserta/i.test(lines[0]))lines.shift();
 return lines.slice(0,200).map(l=>{const[p,tg,k,n]=l.split(/[;,]/).map(s=>s.trim());const T=td(k);
  const c={peserta:p,tgl:tg,t:k,dx:T.dx,nom:+n||T.tarif};
  let bad='';if(!pName(p))bad='Peserta tidak dikenal';else if(!/^\d{4}-\d{2}-\d{2}$/.test(tg||''))bad='Tanggal tidak valid';else if(!TD.find(x=>x.k===k))bad='Kode tindakan tidak dikenal';
  if(!bad)c.flag=detect({...c,id:'_',rs:S.user.rs},S.claims,S.rules);
  return{c,bad,sent:false}});
}

function commit(c,status,note,file){

 c.tl=[{at:c.sub,t:'Diajukan oleh '+rsN(c.rs)}];
 if(c.flag.lvl!=='ok'){c.tl.push({at:c.sub,t:`Ditandai ${LV[c.flag.lvl]} (skor ${c.flag.score})`,hot:1});S.log.push({at:c.sub,who:'Sistem',role:'Sistem',act:`Menandai klaim, skor ${c.flag.score} (${c.flag.rules.map(x=>x.k).join(', ')})`,obj:c.id})}
 if(status==='Diteruskan'){log('Mengajukan klaim (lolos cek otomatis)',c.id)}
 if(status==='Dibatalkan'){c.tl.push({at:c.sub,t:'Dibatalkan RS setelah peringatan dini'});log('Membatalkan klaim setelah peringatan dini',c.id)}
 if(status==='Ditandai'){c.thread.push({who:'RS',text:note,file,at:c.sub});c.tl.push({at:c.sub,t:'Tetap dikirim dengan klarifikasi'});log('Tetap mengirim klaim dengan klarifikasi',c.id);notify('VF',null,`${c.id} ditandai ${LV[c.flag.lvl]} (skor ${c.flag.score}) dari ${rsN(c.rs)}`,c.id)}
 S.claims.push(c);save();return c;
}

 return `<div><button class="btn sm" data-a="back">‹ Kembali</button></div>
 <div class="head"><div><h1>Riwayat pasien ${hash(p)}</h1><p>${list.length} klaim di ${new Set(list.map(c=>c.rs)).size} rumah sakit. Identitas pasien disamarkan.</p></div></div>
 <div class="panel"><ul class="tl">${list.map(c=>`<li class="${c.flag.lvl!=='ok'?'hot':''} ${c.id===ui.histFrom?'me':''}"><div class="row" style="justify-content:space-between"><span><b>${fd(c.tgl)}</b> · ${tdn(c)} · ${esc(rsN(c.rs))}</span><span class="row" style="gap:6px">${c.flag.lvl!=='ok'?risk(c.flag):''}${st(c.status)}</span></div><time>${c.id} · ${rp(c.nom)}${c.id===ui.histFrom?' · klaim yang sedang diperiksa':''}</time> <button class="btn sm" style="margin-top:6px" data-a="open" data-v="${c.id}">Buka</button></li>`).join('')}</ul></div>`;
}

/* ---------- Supervisor portal ---------- */
function vSvDash(){
 const chk=S.claims.filter(c=>c.tgl>=LIVE),fl=chk.filter(c=>c.flag.lvl!=='ok');
 const prevented=chk.filter(c=>(c.status==='Ditolak'||c.status==='Dibatalkan')&&c.flag.lvl!=='ok');
 const saved=prevented.reduce((a,c)=>a+c.nom,0),pending=chk.filter(c=>c.status==='Ditandai'||c.status==='Klarifikasi');
 const weeks=[];for(let i=0;i<6;i++){const s=new Date(Date.parse(LIVE)+i*7*864e5),iso=s.toISOString().slice(0,10),e=new Date(s.getTime()+7*864e5).toISOString().slice(0,10);const w=chk.filter(c=>c.tgl>=iso&&c.tgl<e);weeks.push({l:s.toLocaleDateString('id-ID',{day:'numeric',month:'short',timeZone:'UTC'}),t:w.length,f:w.filter(c=>c.flag.lvl!=='ok').length})}
 const mx=Math.max(1,...weeks.map(w=>w.t));
 const rc=Object.keys(RN).map(k=>({k,n:fl.filter(c=>c.flag.rules.some(r=>r.k===k)).length})),rm=Math.max(1,...rc.map(r=>r.n));
 const rsRows=RS.map(r=>{const a=chk.filter(c=>c.rs===r.id),b=a.filter(c=>c.flag.lvl!=='ok');return{r,a:a.length,b:b.length,x:a.filter(c=>c.status==='Ditolak').length,p:a.length?b.length/a.length*100:0}}).sort((a,b)=>b.b-a.b);
 return `<div class="head"><div><h1>${rpS(saved)} klaim ganda tertahan sebelum dibayar</h1><p>Sejak BPJS-Check aktif ${fd(LIVE)}, dari ${chk.length} klaim yang dicek. Angka dihitung dari data demo.</p></div><button class="btn" data-a="export">Ekspor laporan</button></div>
 <div class="kpis">
  <div class="kpi"><span>Klaim diperiksa</span><b>${chk.length}</b><small>sejak ${fd(LIVE)}</small></div>
  <div class="kpi"><span>Klaim ditandai</span><b>${fl.length}</b><small>${chk.length?(fl.length/chk.length*100).toLocaleString('id-ID',{maximumFractionDigits:1}):0}% dari yang diperiksa</small></div>
  <div class="kpi hot"><span>Dana tercegah</span><b>${rpS(saved)}</b><small>${prevented.length} klaim ditolak / dibatalkan</small></div>
  <div class="kpi"><span>Menunggu keputusan</span><b>${pending.length}</b><small>${rpS(pending.reduce((a,c)=>a+c.nom,0))} ditahan</small></div>
 </div>
 <div class="grid g3"><div class="panel"><div class="row" style="justify-content:space-between"><h2>Klaim per minggu</h2><div class="legend"><span><i style="background:color-mix(in srgb,var(--brand) 22%,var(--panel))"></i>Diperiksa</span><span><i style="background:var(--hi)"></i>Ditandai</span></div></div>
  <div class="bars">${weeks.map(w=>`<div class="c"><div class="stack"><div class="tot" style="height:${w.t/mx*100}%"><span class="v">${w.t}</span><div class="fl" style="height:${w.t?w.f/w.t*100:0}%"></div></div></div><span class="lb">${w.l}</span></div>`).join('')}</div></div>
 <div class="panel"><h2>Aturan yang paling sering terpicu</h2>${rc.map(r=>`<div class="hbar"><span>${r.k} · ${RN[r.k]}</span><span class="t"><i style="width:${r.n/rm*100}%"></i></span><b>${r.n}</b></div>`).join('')}<button class="btn sm" style="margin-top:12px" data-a="go" data-v="sv-rules">Atur aturan</button></div></div>
 <div class="panel"><h2>Rumah sakit dengan tanda terbanyak</h2><div class="scroll"><table class="stack"><thead><tr><th>Rumah sakit</th><th class="num">Klaim</th><th class="num">Ditandai</th><th class="num">% ditandai</th><th class="num">Ditolak</th></tr></thead><tbody>
 ${rsRows.map(x=>`<tr><td>${esc(x.r.name)} <span class="mute small">${esc(x.r.kota)}</span></td><td class="num">${x.a}</td><td class="num">${x.b}</td><td class="num">${x.p.toLocaleString('id-ID',{maximumFractionDigits:1})}%</td><td class="num">${x.x}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function vSvRules(){
 const d=ui.ruleDraft||(ui.ruleDraft=JSON.parse(JSON.stringify(S.rules)));
 const num=(k,p,lab,unit)=>`<label class="f">${lab}<input type="number" min="0" data-r="${k}.${p}" value="${d[k][p]}"><span class="hint">${unit}</span></label>`;
 return `<div class="head"><div><h1>Pengaturan aturan</h1><p>Skor klaim = jumlah bobot aturan yang terpicu (maks. 100). Perubahan berlaku untuk pengecekan klaim berikutnya.</p></div><div class="row"><button class="btn" data-a="rdef">Kembalikan default</button><button class="btn pri" data-a="rsave">Simpan</button></div></div>
 ${Object.keys(RN).map(k=>`<div class="panel rulecard"><div><h2><span class="rule">${k}</span> ${RN[k]}</h2><p class="mute small" style="margin-top:4px">${RD[k]}</p></div>
  <label class="sw" title="Aktif"><input type="checkbox" data-r="${k}.on" ${d[k].on?'checked':''} aria-label="Aktifkan ${k}"><span></span></label>
  <div class="ps">${num(k,'w','Bobot','poin ditambahkan ke skor')}${k==='R2'?num(k,'n','Selisih maksimal (N)','hari'):''}${k==='R5'?num(k,'d','Selisih tanggal (N)','hari')+num(k,'x','Selisih nominal (X)','persen'):''}</div></div>`).join('')}
 <div class="panel"><h2>Ambang label</h2><div class="grid g2" style="margin-top:8px"><label class="f">Risiko sedang mulai dari<input type="number" min="1" data-r="mid" value="${d.mid}"><span class="hint">skor</span></label><label class="f">Risiko tinggi mulai dari<input type="number" min="1" data-r="hi" value="${d.hi}"><span class="hint">skor</span></label></div><p class="small mute" style="margin-top:10px">Di bawah ambang sedang, klaim diteruskan otomatis. Klaim tidak pernah ditolak otomatis.</p></div>`;
}
function vSvLog(){
 const F=ui.logF,q=F.q.toLowerCase();
 const list=[...S.log].filter(l=>(!F.role||l.role===F.role)&&(!q||(l.who+l.act+l.obj).toLowerCase().includes(q))).sort((a,b)=>b.at-a.at);
 return `<div class="head"><div><h1>Log audit</h1><p>Setiap penandaan, keputusan, dan perubahan aturan tercatat dan tidak bisa diubah.</p></div></div>
 <div class="panel"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:12px"><select data-f="logF.role" aria-label="Filter peran"><option value="">Semua peran</option>${['Sistem','Petugas RS','Verifikator','Supervisor'].map(r=>`<option ${F.role===r?'selected':''}>${r}</option>`).join('')}</select><input type="search" id="lq" placeholder="Cari pengguna, aksi, objek" value="${esc(F.q)}" data-f="logF.q"></div>
 <div class="scroll"><table class="stack"><thead><tr><th>Waktu</th><th>Pengguna</th><th>Peran</th><th>Aksi</th><th>Objek</th></tr></thead><tbody>
 ${list.map(l=>`<tr><td class="nw">${ft(l.at)}</td><td>${esc(l.who)}</td><td>${esc(l.role)}</td><td>${esc(l.act)}</td><td class="id">${esc(l.obj)}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ---------- shell ---------- */
const NAV={RS:[['rs-home','Beranda'],['rs-new','Ajukan klaim'],['rs-list','Daftar klaim']],VF:[['vf-queue','Antrean bertanda'],['vf-clean','Klaim tanpa tanda']],SV:[['sv-dash','Dashboard dampak'],['sv-rules','Pengaturan aturan'],['sv-log','Log audit']]};
const VIEWS={'rs-home':vRsHome,'rs-new':vRsNew,'rs-result':vRsResult,'rs-list':vRsList,'rs-detail':vRsDetail,'vf-queue':vVfQueue,'vf-clean':vVfClean,'vf-detail':vVfDetail,'vf-hist':vVfHist,'sv-dash':vSvDash,'sv-rules':vSvRules,'sv-log':vSvLog};
const PARENT={'rs-result':'rs-new','rs-detail':'rs-list','vf-detail':'vf-queue','vf-hist':'vf-queue'};
const myNotif=()=>S.notif.filter(n=>n.role===S.user.role&&(n.role!=='RS'||n.rs===S.user.rs)).sort((a,b)=>b.at-a.at);
function render(){
 const root=$('#root');
 if(!S.user){root.innerHTML=vLogin();return}
 const u=me(),nav=NAV[S.user.role],cur=PARENT[S.view]||S.view,nn=myNotif(),un=nn.filter(n=>!n.read).length;
 const cnt={'vf-queue':S.claims.filter(c=>c.status==='Ditandai').length,'rs-list':S.user.role==='RS'?S.claims.filter(c=>c.rs===S.user.rs&&c.status==='Klarifikasi').length:0};
 let body;try{body=(VIEWS[S.view]||(()=>''))()}catch(e){body=`<div class="panel err">Terjadi kesalahan tampilan: ${esc(e.message)}</div>`}
 root.innerHTML=`<div class="app"><aside class="side"><div class="logo">${logoSvg}<div>BPJS-Check<small>${{RS:'Portal Rumah Sakit',VF:'Portal Verifikator',SV:'Portal Supervisor'}[S.user.role]}</small></div></div>
 <nav class="nav">${nav.map(([v,l])=>`<button class="${cur===v?'on':''}" data-a="go" data-v="${v}">${l}${cnt[v]?`<span class="n">${cnt[v]}</span>`:''}</button>`).join('')}</nav>
 <div class="sidefoot"><button data-a="logout">Ganti peran</button><button data-a="reset">Reset data demo</button></div></aside>
 <div class="main"><header class="top"><span class="crumb">${esc(S.user.role==='RS'?rsN(S.user.rs):'BPJS Kesehatan · data fiktif')}</span>
 <div class="who"><button class="bell" data-a="bell" aria-label="Notifikasi, ${un} belum dibaca"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>${un?`<i>${un}</i>`:''}</button><span><b>${esc(u.name)}</b>${esc(u.org)}</span><span class="av">${esc(u.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</span></div>
 ${ui.notif?`<div class="notif"><h3>Notifikasi</h3>${nn.length?nn.map((n,i)=>`<button class="${n.read?'':'un'}" data-a="nopen" data-v="${S.notif.indexOf(n)}">${esc(n.text)}<time>${ft(n.at)}</time></button>`).join(''):'<div class="empty">Belum ada notifikasi.</div>'}</div>`:''}</header>
 <main class="view">${body}</main></div></div>`;
 for(const t of root.querySelectorAll('table.stack')){const h=[...t.querySelectorAll('thead th')].map(x=>x.textContent);for(const r of t.querySelectorAll('tbody tr'))[...r.cells].forEach((c,i)=>c.dataset.l=h[i]||'')}
}

/* ---------- modal ---------- */
function modal(html){$('#modal').innerHTML=html?`<div class="modal" data-a="mclose-bg"><div class="box" role="dialog" aria-modal="true">${html}</div></div>`:'';const t=$('#modal textarea');if(t)t.focus()}
function keepModal(){
 modal(`<h2>Tetap kirim dengan klarifikasi</h2><p class="mute small">Jelaskan mengapa klaim ini sah. Penjelasan Anda dibaca verifikator bersama alasan penandaan.</p>
 <label class="f">Alasan<textarea id="mTxt" placeholder="Contoh: kontrol ulang sesuai jadwal dokter"></textarea></label>
 <label class="f">Lampiran dokumen pendukung (opsional)<input type="file" id="mFile"></label><p class="err" id="mErr"></p>
 <div class="row" style="justify-content:flex-end"><button class="btn" data-a="mclose">Batal</button><button class="btn pri" data-a="keepok">Kirim</button></div>`);
}
const DEC={ok:['Loloskan klaim','Klaim akan disetujui dan diteruskan ke pembayaran.','Catatan (opsional)',false,'btn pri'],ask:['Minta klarifikasi','RS akan menerima pertanyaan Anda dan klaim ditahan sampai dijawab.','Pertanyaan untuk RS',true,'btn pri'],no:['Tolak klaim','Klaim ditolak sebagai klaim ganda dan nominalnya dihitung sebagai dana tercegah.','Alasan penolakan',true,'btn red']};
function decModal(k){
 const c=C(S.sel),[t,d,l,req,cls]=DEC[k];
 modal(`<h2>${t}</h2><dl class="kv"><dt>Klaim</dt><dd>${c.id} · ${esc(rsN(c.rs))}</dd><dt>Tindakan</dt><dd>${tdn(c)}</dd><dt>Nominal</dt><dd>${rp(c.nom)}</dd><dt>Skor</dt><dd>${c.flag.score} · ${LV[c.flag.lvl]}</dd></dl><p class="small mute">${d}</p>
 <label class="f">${l}${req?' *':''}<textarea id="mTxt"></textarea></label><p class="err" id="mErr"></p>
 <div class="row" style="justify-content:flex-end"><button class="btn" data-a="mclose">Batal</button><button class="${cls}" data-a="decok" data-v="${k}">Konfirmasi</button></div>`);
}

/* ---------- actions ---------- */
function readForm(){const g=id=>document.getElementById(id);if(!g('fPes'))return;Object.assign(ui.form,{peserta:g('fPes').value.trim(),tgl:g('fTgl').value,t:g('fT').value,dx:g('fDx').value,nom:g('fNom').value})}
function submitClaim(){
 readForm();const f=ui.form;
 ui.err=!pName(f.peserta)?'Nomor peserta tidak ditemukan. Pilih dari daftar peserta demo.':!f.tgl?'Isi tanggal berobat.':!f.t?'Pilih tindakan.':!f.dx?'Pilih diagnosis.':!(+f.nom>0)?'Isi nominal klaim.':'';
 if(ui.err)return render();
 ui.checking=true;render();
 setTimeout(()=>{ui.checking=false;const c=buildClaim(f);
  if(c.flag.lvl==='ok'){commit(c,'Diteruskan');ui.result={c,sent:true};ui.form={}}else ui.result={c,sent:false};
  go('rs-result')},900);
}
const A={
 login(v){S.user={role:v,rs:$('#lgRs').value};S.view={RS:'rs-home',VF:'vf-queue',SV:'sv-dash'}[v];ui.form={};ui.batch=[];ui.ruleDraft=null;save();render();window.scrollTo(0,0)},
 logout(){S.user=null;ui.notif=false;save();render()},
 reset(){modal(`<h2>Reset data demo?</h2><p class="mute">Semua klaim, keputusan, dan perubahan aturan yang Anda buat akan dihapus dan data awal dimuat ulang.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-a="mclose">Batal</button><button class="btn red" data-a="resetok">Reset</button></div>`)},
 resetok(){const u=S.user;S=fresh();S.user=u;S.view=u?{RS:'rs-home',VF:'vf-queue',SV:'sv-dash'}[u.role]:'login';Object.assign(ui,{form:{},batch:[],result:null,ruleDraft:null});modal('');save();render();toast('Data demo dimuat ulang')},
 go(v){if(v==='rs-new'){ui.err=''}go(v)},
 open(id){const c=C(id);if(!c)return;if(S.user.role==='RS'){if(c.rs!==S.user.rs)return toast('Klaim RS lain tidak dapat dibuka');go('rs-detail',id)}else{ui.cmp=null;go('vf-detail',id)}},
 bell(){ui.notif=!ui.notif;render()},
 nopen(i){const n=S.notif[+i];if(!n)return;n.read=true;save();if(n.claim)A.open(n.claim);else render()},
 tab(v){readForm();ui.tab=v;render()},
 preset(k){const p=presets().find(x=>x.k===k);if(p){ui.form={...p.f};ui.err='';render()}},
 clear(){ui.form={};ui.err='';render()},
 sample(){ui.batch=parseCsv(SAMPLE);render()},
 review(i){const r=ui.batch[+i];const c=buildClaim(r.c);ui.batch.splice(+i,1);ui.result={c,sent:false};go('rs-result')},
 sendsafe(){let n=0;for(const r of ui.batch)if(!r.bad&&!r.sent&&r.c.flag.lvl==='ok'){const c=buildClaim(r.c);if(c.flag.lvl==='ok'){commit(c,'Diteruskan');r.sent=true;n++}else{r.c.flag=c.flag}}render();toast(n+' klaim terkirim')},
 cancel(){const c=commit(ui.result.c,'Dibatalkan');ui.result=null;ui.form={};toast(c.id+' dibatalkan, tidak dikirim');go('rs-list')},
 fix(){const c=ui.result.c;ui.form={peserta:c.peserta,tgl:c.tgl,t:c.t,dx:c.dx,nom:c.nom};ui.tab='manual';ui.result=null;go('rs-new')},
 keep(){keepModal()},
 keepok(){const t=$('#mTxt').value.trim(),fi=$('#mFile').files[0];if(t.length<10){$('#mErr').textContent='Alasan wajib diisi (minimal 10 karakter).';return}
  const c=commit(ui.result.c,'Ditandai',t,fi&&fi.name);ui.result=null;ui.form={};modal('');toast(c.id+' dikirim ke verifikator');go('rs-detail',c.id)},
 reply(){const t=$('#rpTxt').value.trim(),fi=$('#rpFile').files[0];if(t.length<10){$('#rpErr').textContent='Jawaban wajib diisi (minimal 10 karakter).';return}
  const c=C(S.sel);c.thread.push({who:'RS',text:t,file:fi&&fi.name,at:Date.now()});c.status='Ditandai';c.klarMasuk=true;c.tl.push({at:Date.now(),t:'RS mengirim klarifikasi'});log('Mengirim klarifikasi',c.id);notify('VF',null,`Klarifikasi masuk untuk ${c.id} dari ${rsN(c.rs)}`,c.id);save();toast('Klarifikasi terkirim');render()},
 rsF(v){ui.rsF=v;render()},
 vfTab(v){ui.vfTab=v;render()},
 cmp(v){ui.cmp=v;render()},
 hist(p){ui.histFrom=S.sel;ui.histBack=S.sel;go('vf-hist',p)},
 back(){go('vf-detail',ui.histBack)},
 dec(k){decModal(k)},
 decok(k){const t=$('#mTxt').value.trim();if(DEC[k][3]&&t.length<5){$('#mErr').textContent='Wajib diisi.';return}
  const c=C(S.sel),now=Date.now();c.klarMasuk=false;
  if(k==='ask'){c.status='Klarifikasi';c.thread.push({who:'VF',text:t,at:now});c.tl.push({at:now,t:'Verifikator meminta klarifikasi'});log('Meminta klarifikasi',c.id);notify('RS',c.rs,`Verifikator meminta klarifikasi untuk ${c.id}`,c.id)}
  else{const ok=k==='ok';c.status=ok?'Disetujui':'Ditolak';c.dec={at:now,note:t,by:USERS.VF.name};c.tl.push({at:now,t:ok?'Disetujui verifikator':'Ditolak verifikator: klaim ganda',hot:!ok});log(ok?'Meloloskan klaim':'Menolak klaim',c.id);notify('RS',c.rs,`${c.id} ${ok?'disetujui verifikator':'ditolak: klaim ganda'}`,c.id)}
  modal('');save();toast({ok:'Klaim disetujui',ask:'Permintaan klarifikasi terkirim',no:'Klaim ditolak'}[k]);render()},
 rsave(){const d=ui.ruleDraft;if(!(d.mid>0&&d.hi>d.mid)){toast('Ambang tinggi harus lebih besar dari ambang sedang');return}
  const ch=[];for(const k of Object.keys(RN))for(const p of Object.keys(d[k]))if(d[k][p]!==S.rules[k][p])ch.push(`${k}.${p}: ${S.rules[k][p]} → ${d[k][p]}`);
  for(const p of['mid','hi'])if(d[p]!==S.rules[p])ch.push(`ambang ${p}: ${S.rules[p]} → ${d[p]}`);
  if(!ch.length){toast('Tidak ada perubahan');return}
  S.rules=JSON.parse(JSON.stringify(d));log('Mengubah aturan: '+ch.join('; '),'Pengaturan aturan');save();toast('Aturan disimpan');render()},
 rdef(){ui.ruleDraft=JSON.parse(JSON.stringify(DEF));render();toast('Nilai default dimuat, tekan Simpan untuk menerapkan')},
 export(){modal(`<h2>Ekspor laporan</h2><p class="mute">Di prototype ini ekspor PDF/Excel belum aktif. Pada versi berikutnya, tombol ini mengunduh ringkasan dampak per periode.</p><div class="row" style="justify-content:flex-end"><button class="btn pri" data-a="mclose">Mengerti</button></div>`)},
 mclose(){modal('')},
 'mclose-bg'(v,el,e){if(e.target===el)modal('')}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');
 if(!el){if(ui.notif&&!e.target.closest('.notif')){ui.notif=false;render()}return}
 const f=A[el.dataset.a];if(f){if(el.tagName==='BUTTON')e.preventDefault();f(el.dataset.v,el,e)}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#modal').innerHTML){modal('')}
 if(e.key==='Enter'&&e.target.matches('tr[data-a]'))A.open(e.target.dataset.v);
});
document.addEventListener('submit',e=>{if(e.target.id==='fClaim'){e.preventDefault();submitClaim()}});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='fPes'){ui.form.peserta=t.value.trim();const h=$('#pesHint'),n=pName(ui.form.peserta);if(h)h.textContent=n?'Peserta: '+n:'Ketik atau pilih nomor peserta demo';return}
 if(t.dataset.r){const[k,p]=t.dataset.r.split('.'),d=ui.ruleDraft;const v=t.type==='checkbox'?t.checked:Math.max(0,+t.value||0);if(p)d[k][p]=v;else d[k]=v;return}
 if(t.dataset.f&&t.type==='search'){const[a,b]=t.dataset.f.split('.');if(b)ui[a][b]=t.value;else ui[a]=t.value;const id=t.id,pos=t.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='fT'){readForm();const T=td(t.value);if(t.value){ui.form.dx=T.dx;ui.form.nom=T.tarif}render();return}
 if(t.id==='fFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{ui.batch=parseCsv(String(r.result));render()};r.readAsText(t.files[0]);return}
 if(t.dataset.f&&t.tagName==='SELECT'){const[a,b]=t.dataset.f.split('.');if(b)ui[a][b]=t.value;else ui[a]=t.value;render()}
});
render();
}
</script>
</body>
